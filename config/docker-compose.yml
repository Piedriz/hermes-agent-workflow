# =============================================================================
# Jarvis Agent — docker-compose.yml
#
# Servicios:
#   :18789 → Gateway + Dashboard + Cron
#   :8642  → API OpenAI-compatible (para Lucidbot)
#
# Local:   docker compose up -d --build
# Railway: railway up
# =============================================================================

services:
  jarvis:
    build: .
    image: jarvis-agent
    container_name: jarvis
    restart: unless-stopped
    ports:
      - "18789:18789"
      - "8642:8642"
    volumes:
      - jarvis_data:/opt/data
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
      - VOICE_TOOLS_OPENAI_KEY=${VOICE_TOOLS_OPENAI_KEY}
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${API_SERVER_KEY:-jarvis-api-key-secreto}
      - API_SERVER_HOST=0.0.0.0
    command: ["gateway", "run"]

volumes:
  jarvis_data:
