# =============================================================================
# Jarvis Agent — docker-compose.yml
#
# Railway: railway up (detecta docker-compose.yml automaticamente)
# Local:   docker compose up -d --build
# =============================================================================

services:
  init:
    build: .
    image: jarvis-agent
    container_name: jarvis-init
    volumes:
      - jarvis_data:/opt/data
    command: >
      sh -c "
        if [ ! -f /opt/data/config.yaml ]; then
          cp -r /opt/seed/* /opt/data/ 2>/dev/null || true;
          chown -R 10000:10000 /opt/data 2>/dev/null || true;
          echo 'init: config seeded';
        else
          echo 'init: config exists, skipping';
        fi;
        if [ ! -f /opt/data/.env ]; then
          env | grep -E '^(XAI_|OPENAI_|TAVILY_|OPENROUTER_|API_SERVER_)' > /opt/data/.env;
          chown 10000:10000 /opt/data/.env 2>/dev/null || true;
          echo 'init: .env created from environment';
        fi
      "

  gateway:
    build: .
    image: jarvis-agent
    container_name: jarvis-gateway
    restart: unless-stopped
    ports:
      - "8642:8642"
      - "9119:9119"
      - "18789:18789"
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - jarvis_data:/opt/data
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
      - VOICE_TOOLS_OPENAI_KEY=${VOICE_TOOLS_OPENAI_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY:-jarvis-api-key-secreto}
      - HERMES_DASHBOARD=1
      - HERMES_HOME=/opt/data
    command: gateway run

  tools:
    build: .
    image: jarvis-agent
    container_name: jarvis-tools
    restart: unless-stopped
    ports:
      - "8646:8646"
    depends_on:
      gateway:
        condition: service_started
    volumes:
      - jarvis_data:/opt/data
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HERMES_HOME=/opt/data
      - TOOLS_PORT=8646
    entrypoint: ["python3"]
    command: ["/opt/data/scripts/jarvis_tools.py"]

  web:
    build: .
    image: jarvis-agent
    container_name: jarvis-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      tools:
        condition: service_started
    command: ["python3", "-m", "http.server", "8080", "--directory", "/opt/data"]

volumes:
  jarvis_data:
