# =============================================================================
# Jarvis Agent — docker-compose.yml
#
# Servicios (todos desde la misma imagen):
#   :18789 → Gateway (cron, webhooks, mensajeria)
#   :8642  → API OpenAI-compatible (Lucidbot)
#   :9119  → Dashboard web (chat, sesiones, config)
#
# Local:   docker compose up -d --build
# Railway: railway up
# =============================================================================

services:
  gateway:
    build: .
    image: jarvis-agent
    container_name: jarvis-gateway
    restart: unless-stopped
    ports:
      - "18789:18789"
      - "8642:8642"
    volumes:
      - jarvis_data:/opt/data
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
      - VOICE_TOOLS_OPENAI_KEY=${VOICE_TOOLS_OPENAI_KEY}
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${API_SERVER_KEY:-jarvis-api-key-secreto}
      - API_SERVER_HOST=0.0.0.0
    command: ["gateway", "run"]

  dashboard:
    build: .
    image: jarvis-agent
    container_name: jarvis-dashboard
    restart: unless-stopped
    ports:
      - "9119:9119"
    depends_on:
      - gateway
    volumes:
      - jarvis_data:/opt/data
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]

volumes:
  jarvis_data:
