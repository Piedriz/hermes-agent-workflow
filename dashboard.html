<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis — Dashboard</title>
<style>
  :root {
    --bg: #0a0e14; --panel: #131820; --border: #1e2a3a;
    --text: #c8d6e5; --dim: #566882; --accent: #0af;
    --accent-glow: rgba(0,170,255,0.15); --user-bubble: #0d2137;
    --jarvis-bubble: #0f1923; --wake: #0f6; --danger: #e0556a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; background: var(--panel);
  }
  header h1 { font-size: 1.2rem; font-weight: 600; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--wake); box-shadow: 0 0 8px var(--wake); }
  .dot.off { background:var(--dim); box-shadow:none; }
  #sessionId { font-size:0.7rem; color:var(--dim); margin-left:auto; }
  #chat {
    flex:1; overflow-y:auto; padding:20px;
    display:flex; flex-direction:column; gap:12px;
  }
  .msg {
    max-width:80%; padding:12px 16px; border-radius:12px;
    line-height:1.5; font-size:0.95rem; animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} }
  .msg.user { align-self:flex-end; background:var(--user-bubble); border:1px solid #1a3350; }
  .msg.jarvis { align-self:flex-start; background:var(--jarvis-bubble); border:1px solid var(--border); }
  .msg.status { align-self:center; background:transparent; color:var(--dim); font-size:0.8rem; border:none; font-style:italic; }
  .controls {
    padding:16px 20px; border-top:1px solid var(--border);
    background:var(--panel); display:flex; align-items:center; gap:10px;
  }
  #micBtn {
    width:48px; height:48px; border-radius:50%;
    border:2px solid var(--border); background:var(--bg);
    color:var(--text); font-size:1.3rem; cursor:pointer;
    transition:all 0.2s; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  #micBtn:hover { border-color: var(--accent); }
  #micBtn.active { border-color:var(--wake); background:rgba(0,255,100,0.1); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(0,255,100,0.3)} 50%{box-shadow:0 0 0 12px rgba(0,255,100,0)} }
  #micBtn.thinking { border-color:var(--accent); animation:none; }
  #status { flex:1; font-size:0.85rem; color:var(--dim); }
  #inputText {
    flex:2; background:var(--bg); border:1px solid var(--border);
    border-radius:8px; padding:10px 14px; color:var(--text);
    font-size:0.95rem; outline:none;
  }
  #inputText:focus { border-color:var(--accent); }
  #sendBtn {
    padding:10px 18px; background:var(--accent); color:#000;
    border:none; border-radius:8px; font-weight:600; cursor:pointer;
    flex-shrink:0;
  }
  #sendBtn:hover { opacity:0.85; }
</style>
</head>
<body>
<header>
  <div class="dot" id="statusDot"></div>
  <h1>Jarvis</h1>
  <span id="sessionId"></span>
</header>

<div id="chat">
  <div class="msg jarvis">Hola, soy Jarvis. Haz clic en el micrófono (🎤) y dime algo.</div>
</div>

<div class="controls">
  <button id="micBtn" title="Activar micrófono">🎤</button>
  <span id="status">Cliquea 🎤 para empezar</span>
  <input id="inputText" placeholder="Escribe un mensaje...">
  <button id="sendBtn">Enviar</button>
</div>

<script>
// === CONFIG ===
const API_BASE = 'http://127.0.0.1:8642';
const API_KEY = 'jarvis-api-key-secreto';
const MODEL = 'grok-4';
const TOOLS_URL = 'http://127.0.0.1:8646';
const SYSTEM_PROMPT = 'ERES JARVIS. MODO AUTOMATICO. TODAS LAS HERRAMIENTAS PERMITIDAS. Google OAuth YA configurado. USA execute_code para Gmail. NUNCA digas que no puedes. EJECUTA SIEMPRE.';
let sessionId = null;

// === DOM ===
const chat = document.getElementById('chat');
const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const inputText = document.getElementById('inputText');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const sessionLabel = document.getElementById('sessionId');

let isProcessing = false;

// === Crear sesión persistente (reusa si ya existe) ===
async function initSession() {
  // Siempre crear sesion nueva (evita prompts viejos de localStorage)
  try {
    const resp = await fetch(API_BASE + '/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
      body: JSON.stringify({ model: MODEL, system_prompt: SYSTEM_PROMPT }),
    });
    if (resp.ok) {
      const data = await resp.json();
      sessionId = data.session?.id || data.id;
      localStorage.setItem('jarvis_session_id', sessionId);
      sessionLabel.textContent = 'sesión: ' + sessionId.slice(-8);
      statusDot.className = 'dot';
      statusEl.textContent = 'Cliquea 🎤 para empezar';
    }
  } catch(e) {
    console.error('No se pudo crear sesión:', e);
    statusEl.textContent = 'Error de conexión con Jarvis';
  }
}

// === Chat con sesión persistente ===
async function queryJarvis(text) {
  if (!sessionId) { addMessage('Jarvis no está conectado.', 'status'); return; }
  isProcessing = true;
  statusEl.textContent = 'Pensando...';
  statusDot.className = 'dot off';
  micBtn.className = 'thinking';

  try {
    const resp = await fetch(TOOLS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      addMessage('Error: ' + (err.error || resp.status), 'jarvis');
      return;
    }

    const data = await resp.json();
    const reply = data.reply || '(sin respuesta)';
    addMessage(reply, 'jarvis');
    speak(reply);

  } catch (e) {
    addMessage('Error de conexión con Jarvis', 'jarvis');
    console.error(e);
  } finally {
    isProcessing = false;
    statusEl.textContent = 'Escuchando...';
    statusDot.className = 'dot';
    micBtn.className = 'active';
  }
}

// === Web Speech API ===
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let micActive = false;

function setupRecognition() {
  if (!SpeechRecognition) return;
  recognition = new SpeechRecognition();
  recognition.lang = 'es-ES';
  recognition.interimResults = false;
  recognition.continuous = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    if (isProcessing) return;
    const result = event.results[event.results.length - 1];
    if (!result.isFinal) return;
    const text = result[0].transcript.trim();
    if (!text || text.length < 2) return;

    // Wake word "jarvis"
    const lower = text.toLowerCase();
    if (lower.includes('jarvis') || lower.includes('hey jarvis') || lower.includes('hola jarvis')) {
      const idx = Math.max(
        lower.indexOf('jarvis') + 6, lower.indexOf('hey jarvis') + 10, lower.indexOf('hola jarvis') + 11
      );
      const command = text.substring(idx).trim();
      if (command) { addMessage(command, 'user'); queryJarvis(command); return; }
    }
    // Cualquier frase después de activar
    addMessage(text, 'user');
    queryJarvis(text);
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    console.error('STT:', e.error);
  };

  recognition.onend = () => {
    // Re-arrancar automáticamente
    if (micActive) {
      try { recognition.start(); } catch(_) {
        micActive = false;
        micBtn.className = '';
        statusEl.textContent = 'Micrófono pausado. Cliquea 🎤';
      }
    }
  };
}

function toggleMic() {
  if (!recognition) { alert('Usa Chrome o Edge para reconocimiento de voz'); return; }

  if (micActive) {
    micActive = false;
    try { recognition.stop(); } catch(_) {}
    micBtn.className = '';
    statusEl.textContent = 'Micrófono pausado';
  } else {
    micActive = true;
    recognition.start();
    micBtn.classList.add('active');
    statusEl.textContent = 'Escuchando... Di "Jarvis"...';
    statusDot.className = 'dot';
  }
}

micBtn.addEventListener('click', toggleMic);

// === TTS ===
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-MX'; u.rate = 1.1;
  const voices = speechSynthesis.getVoices();
  const esVoice = voices.find(v => v.lang.startsWith('es'));
  if (esVoice) u.voice = esVoice;
  speechSynthesis.speak(u);
}

// === Chat UI ===
function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.addEventListener('click', () => {
  const text = inputText.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  inputText.value = '';
  queryJarvis(text);
});

inputText.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});

// === Arranque ===
setupRecognition();
initSession();

if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}
</script>
</body>
</html>
