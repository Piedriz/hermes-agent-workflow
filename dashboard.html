<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis — Dashboard</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #131820;
    --border: #1e2a3a;
    --text: #c8d6e5;
    --dim: #566882;
    --accent: #0af;
    --accent-glow: rgba(0,170,255,0.15);
    --user-bubble: #0d2137;
    --jarvis-bubble: #0f1923;
    --danger: #e0556a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
  }
  header h1 {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #0f6;
    box-shadow: 0 0 8px #0f6;
  }
  header .dot.off { background: var(--dim); box-shadow: none; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 0.95rem;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border: 1px solid #1a3350;
  }
  .msg.jarvis {
    align-self: flex-start;
    background: var(--jarvis-bubble);
    border: 1px solid var(--border);
  }
  .msg.status {
    align-self: center;
    background: transparent;
    color: var(--dim);
    font-size: 0.8rem;
    border: none;
    font-style: italic;
  }
  .controls {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #micBtn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1.3rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #micBtn:hover { border-color: var(--accent); }
  #micBtn.listening {
    border-color: #e0556a;
    background: rgba(224,85,106,0.15);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(224,85,106,0.4)} 50%{box-shadow:0 0 0 12px rgba(224,85,106,0)} }
  #micBtn.thinking { border-color: var(--accent); }
  #status {
    flex: 1;
    font-size: 0.85rem;
    color: var(--dim);
  }
  #inputText {
    flex: 2;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }
  #inputText:focus { border-color: var(--accent); }
  #sendBtn {
    padding: 10px 18px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
  }
  #sendBtn:hover { opacity: 0.85; }
</style>
</head>
<body>
<header>
  <div class="dot" id="statusDot"></div>
  <h1>Jarvis</h1>
  <span style="font-size:0.75rem;color:var(--dim);margin-left:auto" id="sessionLabel"></span>
</header>

<div id="chat">
  <div class="msg jarvis">Hola, soy Jarvis. Decí "Hey Jarvis" o escribime. Estoy listo.</div>
</div>

<div class="controls">
  <button id="micBtn" title="Hablar (o di Hey Jarvis)">🎤</button>
  <span id="status">Listo</span>
  <input id="inputText" placeholder="Escribe un mensaje..." autofocus>
  <button id="sendBtn">Enviar</button>
</div>

<script>
// === CONFIG ===
const API_URL = 'http://127.0.0.1:8642/v1/chat/completions';
const API_KEY = 'jarvis-api-key-secreto';
const MODEL = 'grok-4';
let sessionId = 'jarvis-web-' + Date.now();
const SYSTEM_PROMPT = 'Eres Jarvis, un asistente personal. Responde SIEMPRE en español, conciso y amable. Usa máximo 3 frases.';

// === DOM ===
const chat = document.getElementById('chat');
const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const inputText = document.getElementById('inputText');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const sessionLabel = document.getElementById('sessionLabel');
sessionLabel.textContent = 'sesión: ' + sessionId.slice(-8);

// === Web Speech API ===
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;
let isProcessing = false;  // bloquea resultados mientras Jarvis piensa
let wakeEnabled = true;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'es-ES';
  recognition.interimResults = false;
  recognition.continuous = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    if (isProcessing) return;  // esperar a que termine de responder

    const result = event.results[event.results.length - 1];
    if (!result.isFinal) return;
    const text = result[0].transcript.trim();
    if (!text) return;

    // Wake word detection
    const lower = text.toLowerCase();
    if (wakeEnabled && (lower.includes('jarvis') || lower.includes('hey jarvis') || lower.includes('hola jarvis'))) {
      const idx = Math.max(
        lower.indexOf('jarvis') + 6,
        lower.indexOf('hey jarvis') + 10,
        lower.indexOf('hola jarvis') + 11
      );
      const command = text.substring(idx).trim();
      if (command) {
        addMessage(command, 'user');
        queryJarvis(command);
      } else {
        speak('Dime, ¿en qué puedo ayudarte?');
      }
      return;
    }

    // Sin wake word: solo procesa si ya fue activado
    addMessage(text, 'user');
    queryJarvis(text);
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech') return;
    console.error('STT error:', e.error);
    stopListening();
  };

  recognition.onend = () => {
    if (isListening) recognition.start();
  };
}

// === Voice Output ===
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-MX';
  u.rate = 1.1;
  u.pitch = 1;
  // Find a Spanish voice
  const voices = speechSynthesis.getVoices();
  const esVoice = voices.find(v => v.lang.startsWith('es')) || voices[0];
  if (esVoice) u.voice = esVoice;
  u.onstart = () => { statusEl.textContent = 'Hablando...'; };
  u.onend = () => { statusEl.textContent = 'Listo'; };
  speechSynthesis.speak(u);
}

// === Chat ===
function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addStatus(text) {
  const div = document.createElement('div');
  div.className = 'msg status';
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// === API ===
async function queryJarvis(text) {
  isProcessing = true;
  statusEl.textContent = 'Pensando...';
  statusDot.className = 'dot off';
  micBtn.className = 'thinking';

  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY,
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          { role: 'user', content: text }
        ],
        max_tokens: 250,
      }),
    });

    if (!resp.ok) {
      addMessage('Error: API no disponible (' + resp.status + ')', 'jarvis');
      return;
    }

    const data = await resp.json();
    const reply = data.choices[0].message.content.trim();
    addMessage(reply, 'jarvis');
    speak(reply);

  } catch (e) {
    addMessage('Error: No se pudo conectar a Jarvis (' + API_URL + ')', 'jarvis');
    console.error(e);
  } finally {
    isProcessing = false;
    statusEl.textContent = wakeEnabled ? 'Di "Hey Jarvis"...' : 'Escuchando...';
    statusDot.className = 'dot';
    micBtn.className = '';
  }
}

// === Controls ===
function startListening() {
  if (!recognition) { alert('Tu navegador no soporta reconocimiento de voz. Usa Chrome o Edge.'); return; }
  isListening = true;
  wakeEnabled = false;
  recognition.start();
  micBtn.classList.add('listening');
  statusEl.textContent = 'Escuchando...';
}

function stopListening() {
  isListening = false;
  try { recognition.stop(); } catch(e) {}
  micBtn.classList.remove('listening', 'thinking');
  statusEl.textContent = 'Listo';
  setTimeout(() => { wakeEnabled = true; }, 1000);
}

micBtn.addEventListener('click', () => {
  if (isListening) stopListening();
  else startListening();
});

sendBtn.addEventListener('click', () => {
  const text = inputText.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  inputText.value = '';
  queryJarvis(text);
});

inputText.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});

// Auto-start wake word listening
if (recognition) {
  recognition.start();
  statusEl.textContent = 'Di "Hey Jarvis" para activarme...';
  isListening = true;
  micBtn.classList.add('listening');
}

// Load voices
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

statusDot.className = 'dot';
</script>
</body>
</html>
