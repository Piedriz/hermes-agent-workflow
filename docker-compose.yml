# =============================================================================
# Jarvis Agent — docker-compose.yml
#
# Mismo archivo para Desarrollo Local y Railway Produccion.
#
# Local:
#   docker compose up -d --build
#
# Railway:
#   railway up
# =============================================================================

services:
  jarvis:
    build: .
    image: jarvis-agent
    container_name: jarvis
    restart: unless-stopped
    ports:
      - "18789:18789"
      - "9119:9119"
    volumes:
      - jarvis_data:/opt/data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - XAI_API_KEY=${XAI_API_KEY}
      - VOICE_TOOLS_OPENAI_KEY=${VOICE_TOOLS_OPENAI_KEY}
    command: ["gateway", "run"]

volumes:
  jarvis_data:
