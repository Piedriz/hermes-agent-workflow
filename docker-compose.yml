# =============================================================================
# Jarvis Agent — docker-compose.yml
# =============================================================================
# Desarrollo local:
#   docker compose up -d
#   docker compose logs -f gateway
#
# Produccion Railway:
#   railway up
# =============================================================================

services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: jarvis-gateway
    restart: unless-stopped
    ports:
      - "18789:18789"
    volumes:
      - .:/opt/data
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - XAI_API_KEY=${XAI_API_KEY:-}
      - VOICE_TOOLS_OPENAI_KEY=${VOICE_TOOLS_OPENAI_KEY:-}
    command: ["gateway", "run"]

  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: jarvis-dashboard
    restart: unless-stopped
    ports:
      - "9119:9119"
    depends_on:
      - gateway
    volumes:
      - .:/opt/data
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - XAI_API_KEY=${XAI_API_KEY:-}
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
